<div class="container-sm pt-4 shadow border rounded-2 me-4" >
    <h4>Profile Information</h4>

    <form (ngSubmit)="onSubmit()">
        
        <div class="form-group pt-2">
            <label for="email" class="form-label">Email</label>
            <input 
                type="email" 
                class="form-control" 
                id="email"
                [value]="user()?.email ?? ''"
                name="email" 
                readonly>
        </div>

        <div class="form-group pt-2">
            <label for="username" class="form-label">Username</label>
            <input 
                type="text" 
                class="form-control" 
                id="username"
                [value]="username()"
                (input)="username.set($any($event.target).value)"
                name="username" 
                [disabled]="!editProfile()">
        </div>

        <div class="form-group pt-2">
            <label for="bio" class="form-label">Bio</label>
            <input 
                type="text" 
                class="form-control" 
                id="bio"
                [value]="bio()"
                (input)="bio.set($any($event.target).value)"
                name="bio" 
                [disabled]="!editProfile()">
        </div>

        <div class="form-group pt-2">
            <label for="avatarurl" class="form-label">Avatar URL</label>
            <input 
                type="text" 
                class="form-control" 
                id="avatarurl"
                [value]="avatarUrl()"
                (input)="avatarUrl.set($any($event.target).value)"
                name="avatarurl" 
                [disabled]="!editProfile()">
        </div>

        @if (!editProfile()) {
            <button type="button" class="btn btn-primary mt-3 mb-2" (click)="onEdit()">Edit</button>
        }

        @if (editProfile()) {
            <button type="submit" class="btn btn-success mt-3 mb-2 me-2">Save</button>
            <button type="button" class="btn btn-secondary mt-3 mb-2" (click)="onCancel()">Cancel</button>
        }
    </form>
</div>
