
<form (ngSubmit)="onSubmit()">
    <div class="container-sm pt-5" >
        <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email" aria-describedby="emailHelp">
        </div>
        <div class="form-group pt-2">
        <label for="password">Password</label>
        <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password">
        </div>
        <div class="form-group form-check"> <!--TODO:Add Forgot Password Button Here-->
        <!--<input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Check me out</label>-->
        </div>
        <button type="submit" class="btn btn-primary" >Login</button>
    </div>
</form>
