<form (ngSubmit)="onSubmit()" >
    <div class="container-sm pt-5">
        <div class="form-group">
            <label for="exampleInputUserName">User Name</label>
            <input type="text" class="form-control" id="exampleInputUserName" name="username" [(ngModel)]="username">
        </div>
        <div class="form-group pt-2">
            <label for="exampleInputEmail1">Email address</label>
            <input type="email" class="form-control" id="exampleInputEmail1" name="email" [(ngModel)]="email">
        </div>
        <div class="form-group pt-2">
            <label for="exampleInputPassword1">Password</label>
            <input type="password" class="form-control" id="exampleInputPassword1" aria-describedby="passwordHelp1" name="password1" [(ngModel)]="password1">
            <small id="passwordHelp" class="form-text text-muted">Must be at least 8 characters, include one uppercase letter, one number, and one special character (!@#$%...).</small>
        </div>
        <div class="form-group pt-2">
            <label for="exampleInputPassword2">Confirm Password</label>
            <input type="password" class="form-control" id="exampleInputPassword2" aria-describedby="passwordHelp2" name="password2" [(ngModel)]="password2">
            <div id="passwordHelp" [ngClass]="!passwordError ? 'text-muted' : 'text-danger'" class="form-text small">
                {{passwordHint}}
            </div>
        </div>
        <div class="form-group form-check">
        <!--<input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Check me out</label>-->
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </div>
</form>
